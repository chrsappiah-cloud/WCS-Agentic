name: Backend CI

on:
  workflow_dispatch:
  # Path-scoped runs superseded by ci.yml on main; use dispatch for backend-only debugging.

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift package tests (API)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation-pack
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift test
        run: swift test

  docker-build:
    name: Docker build (Vapor starter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation-pack
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config

      - name: Build image
        run: docker compose build
