name: Platform CI

on:
  workflow_dispatch:
  # Path-scoped runs superseded by ci.yml on main; use dispatch for platform-only debugging.

jobs:
  orchestrator-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node --test test/store.test.js

  python-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/agents/onboarding-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import app; assert app.app"
